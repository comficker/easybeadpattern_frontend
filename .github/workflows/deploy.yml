name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the swap.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HOST: 45.76.181.237
  DIR: /home/frontend/easybeadpattern

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      # Built here, not on the 2 GB VPS: the Nitro output needs no install there.
      - name: Build
        run: bun run build

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload
        run: rsync -az --no-owner --no-group --delete -e "ssh -i ~/.ssh/id_ed25519" .output/ "root@$HOST:$DIR/.output.new/"

      # Swap the new build in, then restart; the old one stays until the swap.
      - name: Release
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@$HOST" "DIR=$DIR bash -s" <<'REMOTE'
          set -e
          cd "$DIR"
          rm -rf .output.old
          [ -d .output ] && mv .output .output.old
          mv .output.new .output
          if pm2 describe easybeadpattern >/dev/null 2>&1; then
            pm2 restart easybeadpattern --update-env
          else
            PORT=4015 NUXT_PUBLIC_SITE_URL=https://easybeadpattern.com \
              pm2 start .output/server/index.mjs --name easybeadpattern --cwd "$DIR" --max-memory-restart 250M
            pm2 save
          fi
          rm -rf .output.old
          REMOTE

      - name: Smoke test
        run: |
          sleep 3
          for p in / /patterns /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://easybeadpattern.com$p")
            echo "$p $code"
            [ "$code" = 200 ] || exit 1
          done

      # Tell Bing (and Yandex, Seznam, Naver) what changed, straight after the
      # smoke test -- which has already waited for /sitemap.xml to answer 200
      # from the new build, so the list below is this release's, not the old
      # one's. The key is public by design: IndexNow verifies it by fetching
      # public/58f90d42b8981009e17bd2c2b1cf2798.txt from this very host.
      - name: Ping IndexNow
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.request
          KEY = "58f90d42b8981009e17bd2c2b1cf2798"
          HOST = "easybeadpattern.com"
          # The default python-urllib agent gets turned away by the bot rules.
          UA = {"User-Agent": "easybeadpattern-indexnow/1.0"}

          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30).read().decode()

          # IndexNow fetches the key file to prove the ping is ours, so there
          # is no point pinging before pm2 is serving it.
          for attempt in range(12):
              try:
                  if get(f"https://{HOST}/{KEY}.txt").strip() == KEY:
                      print("key file live after", attempt * 5, "s")
                      break
              except Exception:
                  pass
              time.sleep(5)
          else:
              print("key file never became reachable; pinging anyway")

          urls = re.findall(r"<loc>([^<]+)</loc>", get(f"https://{HOST}/sitemap.xml"))
          print(f"{len(urls)} URLs from the sitemap")
          for i in range(0, len(urls), 10000):
              body = json.dumps({
                  "host": HOST,
                  "key": KEY,
                  "keyLocation": f"https://{HOST}/{KEY}.txt",
                  "urlList": urls[i:i + 10000],
              }).encode()
              req = urllib.request.Request(
                  "https://api.indexnow.org/IndexNow", data=body,
                  headers={"Content-Type": "application/json; charset=utf-8", **UA})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      print("IndexNow", r.status)
              except Exception as e:
                  # A failed ping must never fail a deploy that already shipped.
                  print("IndexNow ping failed:", e)
          EOF
